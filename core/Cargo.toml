# One workspace for pinholed: the core (this package), pinholed itself
# (daemon), and the Rust of the built-in source plugins, which lives in
# their folders and is linked into pinholed. Its root is here, not at the
# top of the checkout, so the lock file and core/target stay where they were
# and the plugins' own helpers (series' finder, send's sender) stay crates
# of their own: see docs/core-and-plugins.md, A3.
[workspace]
members = ["daemon", "../plugins/icloud/source", "../plugins/folder/source"]
default-members = [".", "daemon", "../plugins/icloud/source", "../plugins/folder/source"]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
kamadak-exif = "0.6"
libc = "0.2"
p256 = { version = "0.13", features = ["ecdsa"] }
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "gzip", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
url = "2"
pinhole-core = { path = "." }
pinhole-folder = { path = "../plugins/folder/source" }
pinhole-icloud = { path = "../plugins/icloud/source" }

[package]
name = "pinhole-core"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Pinhole's core: the service, the library index and the cache, whatever the photos come from"

[dependencies]
anyhow.workspace = true
clap.workspace = true
image.workspace = true
# A photo's camera, from the EXIF of its file at hand (sync::read_cameras).
kamadak-exif.workspace = true
# setpriority, for the plugins' workers (workers.rs).
libc.workspace = true
rand.workspace = true
rayon.workspace = true
# Nothing in the core fetches with it yet: the URL tickets of sources of
# your own will (A4).
reqwest.workspace = true
rusqlite.workspace = true
serde_json.workspace = true

[[bin]]
name = "pinhole-fake"
path = "src/bin/fake.rs"
