name: Pinhole Cargo cache
description: Cache Cargo dependency downloads for the pinned build environment.
runs:
  using: composite
  steps:
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cache/pinhole-ci/cargo/registry
          ~/.cache/pinhole-ci/cargo/git
        key: pinhole-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/Dockerfile', '**/Cargo.lock') }}
